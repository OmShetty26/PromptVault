
name: PromptVault CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress production migration.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: development
      COOKIE_SAMESITE: lax

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  production-migrations:
    name: Production database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only migrate production on pushes or manual runs targeting main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    needs:
      - backend-tests
      - frontend-checks

    env:
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SECRET_KEY: migration-only-placeholder-secret-key-not-used
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: production
      COOKIE_SAMESITE: lax

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply production migrations
        run: python -m alembic upgrade head

      - name: Verify database revision
        run: python -m alembic current
